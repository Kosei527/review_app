<!DOCTYPE html>
<html>
    <head>
        <title> List </title>
        <meta charset="UTF-8">
    </head>
    <body>
        <a href="/save-form">保存</a>
        <a href="/list-page">一覧</a>
        <form action="/list-page" method="get">
            <input id="keyword" name="keyword">
            <input type="submit">
        </form>

        {% for row in rows %}
            分野: {{ row.domain}}<br>
            おさらい: {{ row.recap}}<br>
            なぜ: {{row.why}}<br>
            一般化: {{row.generalization}}<hr>
        {% endfor %}
    </body>
</html>
